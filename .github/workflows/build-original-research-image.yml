name: Build original research illustration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified WebP
        shell: bash
        run: |
          cat assets/research_chunks/part*.txt | tr -d '\n\r' > /tmp/research-image.b64
          base64 --decode /tmp/research-image.b64 > assets/research-across-scales-original.webp
          echo "70703d11063c34566ad842e4a835675ee4ac86059602c0ee97c630b1e13feb6e  assets/research-across-scales-original.webp" | sha256sum --check -
          file assets/research-across-scales-original.webp
          test "$(stat -c%s assets/research-across-scales-original.webp)" -eq 26216

      - name: Commit verified image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research-across-scales-original.webp
          if git diff --cached --quiet; then
            echo "Verified image already current."
          else
            git commit -m "Add verified original ESIL research illustration"
            git push
          fi
