name: Re-encode research illustration

on:
  push:
    branches: [main]
    paths:
      - 'assets/research-across-scales.webp'
      - '.github/workflows/reencode-research-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Convert WebP to JPEG
        run: |
          python - <<'PY'
          from PIL import Image
          src = "assets/research-across-scales.webp"
          dst = "assets/research-across-scales.jpg"
          im = Image.open(src).convert("RGB")
          im.save(dst, "JPEG", quality=90, optimize=True, progressive=False)
          print(im.size)
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research-across-scales.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Generate Safari-compatible research illustration"
            git push
          fi
