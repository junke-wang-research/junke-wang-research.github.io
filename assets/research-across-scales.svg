<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ESIL research across equipment, buildings, and energy networks</title>
<desc id="desc">A vector conceptual diagram connecting thermal equipment, an intelligent building, distributed energy resources, and the electric grid through modeling, sensing, optimization, control, diagnostics, and validation.</desc>
<defs>
  <style>
    .ink{stroke:#262626;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#777;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .crimson{stroke:#841617;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .soft{fill:#f7f4f3}
    .panel{fill:#fff;stroke:#dedbd9;stroke-width:3}
    .label{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#202020}
    .small{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#626262}
    .tiny{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#841617;letter-spacing:1.5px}
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#841617"/>
  </marker>
</defs>

<rect width="1200" height="600" fill="#ffffff"/>
<rect x="32" y="32" width="1136" height="536" rx="18" class="soft"/>

<!-- equipment -->
<rect x="72" y="118" width="270" height="330" rx="18" class="panel"/>
<text x="207" y="92" text-anchor="middle" class="tiny">THERMAL EQUIPMENT</text>
<rect x="108" y="167" width="148" height="140" rx="10" class="ink"/>
<circle cx="182" cy="237" r="45" class="thin"/>
<path d="M182 198 C201 215 201 229 182 237 C163 244 153 232 162 215 C168 205 174 201 182 198Z" fill="#d9c7c7" stroke="#841617" stroke-width="3"/>
<path d="M221 237 C205 257 190 257 182 237 C175 218 187 208 204 218 C214 224 218 230 221 237Z" fill="#d9c7c7" stroke="#841617" stroke-width="3"/>
<path d="M182 276 C163 260 163 245 182 237 C201 229 211 241 201 258 C196 268 190 273 182 276Z" fill="#d9c7c7" stroke="#841617" stroke-width="3"/>
<rect x="270" y="171" width="38" height="174" rx="18" fill="#fff" stroke="#262626" stroke-width="5"/>
<line x1="289" y1="205" x2="289" y2="311" class="thin"/>
<path d="M256 209 H270 M256 268 H270" class="crimson"/>
<circle cx="120" cy="355" r="10" fill="#841617"/>
<circle cx="182" cy="355" r="10" fill="#841617"/>
<circle cx="244" cy="355" r="10" fill="#841617"/>
<path d="M120 355 H244" class="thin"/>
<text x="207" y="405" text-anchor="middle" class="small">Heat pumps · storage</text>
<text x="207" y="430" text-anchor="middle" class="small">sensing · embedded control</text>

<!-- building -->
<rect x="425" y="118" width="350" height="330" rx="18" class="panel"/>
<text x="600" y="92" text-anchor="middle" class="tiny">INTELLIGENT BUILDINGS</text>
<path d="M485 206 L600 142 L715 206 V382 H485 Z" fill="#fff" stroke="#262626" stroke-width="5"/>
<rect x="531" y="238" width="54" height="54" fill="#f7f4f3" stroke="#777" stroke-width="3"/>
<rect x="616" y="238" width="54" height="54" fill="#f7f4f3" stroke="#777" stroke-width="3"/>
<rect x="531" y="315" width="54" height="47" fill="#f7f4f3" stroke="#777" stroke-width="3"/>
<rect x="616" y="315" width="54" height="47" fill="#f7f4f3" stroke="#777" stroke-width="3"/>
<path d="M535 171 L578 148 L592 173 L550 196 Z M595 145 L639 169 L625 194 L582 170 Z" fill="#841617" opacity=".88"/>
<circle cx="600" cy="218" r="16" fill="#fff" stroke="#841617" stroke-width="5"/>
<path d="M600 202 V187 M616 218 H631 M600 234 V249 M584 218 H569" class="crimson" style="stroke-width:4"/>
<path d="M500 382 H700" class="crimson"/>
<text x="600" y="405" text-anchor="middle" class="small">Thermal dynamics · flexible loads</text>
<text x="600" y="430" text-anchor="middle" class="small">optimization · autonomous control</text>

<!-- network -->
<rect x="858" y="118" width="270" height="330" rx="18" class="panel"/>
<text x="993" y="92" text-anchor="middle" class="tiny">ENERGY NETWORKS</text>
<line x1="993" y1="167" x2="993" y2="339" class="ink"/>
<line x1="945" y1="212" x2="1041" y2="212" class="ink"/>
<line x1="958" y1="257" x2="1028" y2="257" class="ink"/>
<line x1="993" y1="167" x2="945" y2="339" class="thin"/>
<line x1="993" y1="167" x2="1041" y2="339" class="thin"/>
<line x1="945" y1="339" x2="1041" y2="339" class="ink"/>
<circle cx="907" cy="181" r="11" fill="#841617"/>
<circle cx="1080" cy="181" r="11" fill="#841617"/>
<circle cx="907" cy="341" r="11" fill="#841617"/>
<circle cx="1080" cy="341" r="11" fill="#841617"/>
<path d="M907 181 C944 166 965 176 993 196 M1080 181 C1042 166 1021 176 993 196 M907 341 C945 360 970 350 993 327 M1080 341 C1042 360 1018 350 993 327" class="crimson" style="stroke-width:4"/>
<text x="993" y="405" text-anchor="middle" class="small">Grid · DERs · storage · mobility</text>
<text x="993" y="430" text-anchor="middle" class="small">coordination · demand flexibility</text>

<!-- connections -->
<path d="M342 278 C382 278 393 278 425 278" class="crimson" marker-end="url(#arrow)"/>
<path d="M775 278 C815 278 826 278 858 278" class="crimson" marker-end="url(#arrow)"/>

<!-- intelligence bar -->
<rect x="110" y="489" width="980" height="56" rx="28" fill="#841617"/>
<text x="600" y="525" text-anchor="middle" style="font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:.25px">
  Modeling · Sensing · Estimation · Optimization · Control · Diagnostics · Experimental Validation
</text>
</svg>